name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Leak gate (sensitive terms must never appear)
        run: |
          ! grep -riE "tuobra|bogota|medellin|antioquia" --include="*.py" --include="*.json" --include="*.md" src data README.md
      - name: Unit tests
        run: pytest -q
      # Eval gates (AC-2, AC-3) are wired in T10 once the eval runner exists.
