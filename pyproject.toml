[project]
name = "oficio"
version = "0.1.0"
description = "The verification-first agent engine for real-world trades. The LLM talks; deterministic engines calculate; evals prove it."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
agent = ["anthropic>=0.40", "fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
